# ============================================================================
# Default configuration - applies to every environment unless overridden by
# config-<env>.properties or a -D system property / OS env var of the same
# name (see com.company.automation.api.config.ConfigReader for precedence rules).
# ============================================================================

# Base URL every relative request path (e.g. "/posts/1") is resolved against.
base.url=https://jsonplaceholder.typicode.com

api.timeout.seconds=30
api.ignore.https.errors=false

# When true, every request/response is logged at INFO (not just attached to
# the report on failure) - useful while developing locally, noisy for CI.
api.log.all.exchanges=false
