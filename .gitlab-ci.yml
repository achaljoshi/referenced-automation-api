# ============================================================================
# GitLab CI pipeline for referenced-automation-api.
#
# Triggers on: any push to main (including a merge request being merged),
# every merge request, and manual "Run pipeline" from the GitLab UI - see
# the `workflow:` block below.
#
# ---- Restricted-network setup: read this before your first run ----
#
# `mcr.microsoft.com` and the public npm registry are not reachable from
# this network - every image and package this pipeline needs has to come
# from your org's JFrog Artifactory instead. Two CI/CD variables make that
# work (Settings > CI/CD > Variables in this project, or set at group
# level so every repo in the family shares them):
#
#   NPM_REGISTRY_URL            Your Artifactory npm registry URL (the same
#                                one already configured in your local
#                                ~/.npmrc / npm config - this pipeline never
#                                hardcodes it, just reads it from the
#                                variable). If unset, `npm ci` falls back to
#                                npm's normal default registry, which will
#                                fail here - so this one is effectively
#                                required.
#   PLAYWRIGHT_DOWNLOAD_HOST     Optional. Only set this if your Artifactory
#                                also mirrors Playwright's browser-binary
#                                CDN (a "generic remote repository" pointed
#                                at playwright.azureedge.net, in Artifactory
#                                terms). Leave unset to let Playwright try
#                                its real CDN directly - some networks allow
#                                that one host through even when general
#                                internet access is blocked.
#
# `image:` below is the Playwright Docker image mirrored into this org's
# JFrog Artifactory - confirmed reachable, unlike mcr.microsoft.com. It's
# used only as a Node.js + Ubuntu Jammy base with the OS-level libraries
# browsers need already installed - NOT as the source of the browsers
# themselves. The version baked into that image (v1.47.0) does not have to
# match this repo's own @playwright/test version (kept at whatever
# package.json already pins, unchanged for CI's sake) - the `test` job
# below runs `npx playwright install chromium` itself, after `npm ci`, to
# fetch a browser binary that actually matches whatever version npm just
# installed. Running a Playwright driver against a browser built for a
# different Playwright version is exactly the kind of mismatch that fails
# in confusing, hard-to-debug ways - installing fresh every run avoids
# ever needing to keep an image tag and a package.json version in sync by
# hand. `--with-deps` is deliberately NOT used - that flag also apt-get
# installs OS packages, which needs its own network path to a
# Debian/Ubuntu mirror. The image already has everything the browser
# needs at the OS level, so a plain `playwright install chromium`
# (binary only) is enough and avoids that extra network dependency.
#
# If the `npx playwright install` step fails with a network error, that's
# the concrete signal that this network has no reachable path to a
# Playwright browser source at all - at that point either ask your
# platform team for a PLAYWRIGHT_DOWNLOAD_HOST mirror, or for a Docker
# image tag in Artifactory whose baked-in browser version actually matches
# this repo's @playwright/test version.
#
# Only `chromium` is installed here (not the 3-browser matrix
# referenced-automation-ui uses) - this repo's own tests only ever request
# the default `page` fixture (for mockApiRoute/record-replay), they don't
# test cross-browser behaviour the way a real UI suite does.
#
# ---- Cross-repo dependencies: installed by version ----
#
# The @automation/* packages this repo uses are listed with their versions in package.json and installed by
# `npm ci` from the registry in NPM_REGISTRY_URL, like any other package - nothing is cloned or packed here.
# So every package this repo depends on must be PUBLISHED there at the version package.json asks for
# (README: Publishing a package). To take a newer version, change it in package.json, run `npm install` and
# commit package.json and package-lock.json.
# ============================================================================

image: csg-cst-docker-local.artifactory.alm.corp.hmrc.gov.uk:443/common/microsoft/playwright:v1.47.0-jammy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

stages:
  - build
  - test
  - report

variables:
  npm_config_cache: "${CI_PROJECT_DIR}/.npm-cache"

cache:
  key: "${CI_COMMIT_REF_SLUG}-npm"
  paths:
    - .npm-cache/

before_script:
  - if [ -n "${NPM_REGISTRY_URL:-}" ]; then npm config set registry "$NPM_REGISTRY_URL"; fi
  - if [ -n "${PLAYWRIGHT_DOWNLOAD_HOST:-}" ]; then export PLAYWRIGHT_DOWNLOAD_HOST; fi

build:
  stage: build
  script:
    - npm ci
    - npm run build
    - npm run lint
    - npm run typecheck
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

test:
  stage: test
  needs: ["build"]
  script:
    - npm ci
    - npx playwright install chromium
    - npm test
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
      - allure-results/
      - logs/
    reports:
      junit: test-results/junit.xml
    expire_in: 30 days

# ---- Security gates: dependency audit + secret scan ----
#
# automation-audit-gate fails on high/critical advisories unless audit-allowlist.json accepts them - each exception
# has an owner, a reason and an EXPIRY DATE, so an accepted risk is re-decided on purpose. automation-scan-secrets
# fails if a secret is about to be committed (and never prints it). Both ship in @automation/referenced-automation-utils.
# allow_failure is true until this job has run green on your GitLab (the audit needs NPM_REGISTRY_URL to be reachable
# and to support `npm audit`) - then set it to false.
security:
  stage: test
  needs: ["build"]
  allow_failure: true
  script:
    - npm ci
    - npx automation-scan-secrets
    - npx automation-audit-gate --allow-unassigned

# The Allure report. It uses the allure-commandline version pinned in package.json (devDependency) rather than an
# unpinned global install, and it needs a Java runtime (the Allure CLI is a Java program): the Playwright image used
# above may not have one - if `java -version` fails here, use an image that has it (or one that adds it). The job takes
# allure-results from the `test` job's artifacts and only publishes when there are results to publish.
# ---- Fortnightly framework audit (start it by hand: "Run pipeline" is not needed, use this job's play button) ----
#
# The automated part of the audit (docs/governance/AUDIT.md in referenced-automation-utils): waits, skips, assertions,
# traceability, dependencies, governance files, pipeline and documentation consistency. The report is the job's artifact.
# Set AUDIT_RUN_GATES=1 on the pipeline to also run lint, typecheck, test and security inside this job (slow).
audit:
  stage: report
  needs: ["build"]
  when: manual
  allow_failure: true
  script:
    - npm ci
    - npx automation-framework-audit --out audit-reports ${AUDIT_RUN_GATES:+--run}
  artifacts:
    when: always
    paths:
      - audit-reports/
    expire_in: 90 days

pages:
  stage: report
  needs: ["test"]
  script:
    - |
      if [ ! -d allure-results ] || [ -z "$(ls -A allure-results 2>/dev/null)" ]; then
        echo "No allure-results from the test job - nothing to publish."
        exit 0
      fi
    - java -version || { echo "The Allure CLI needs Java, which this image does not have - see the comment above the pages job." >&2; exit 1; }
    - npm ci
    - npx allure generate allure-results --clean -o public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
