# ============================================================================
# GitLab CI pipeline for the Referenced Automation API Framework.
#
# Stages:
#   dependencies - build+install referenced-automation-utils locally (see note below)
#   build        - compile the framework + sample suite
#   test         - run Cucumber scenarios against the public JSONPlaceholder API, retry only what failed
#   report       - publish Cucumber/Extent/Allure artifacts (always, even on failure)
#   deploy       - `mvn deploy` the framework jar to Nexus (main branch / tags only)
#
# NOTE on the "dependencies" stage: this framework depends on
# referenced-automation-utils (com.company.automation:referenced-automation-utils),
# which is not yet published to this org's Nexus. Until it is, this stage
# clones and `mvn install`s it into the shared .m2 cache so `test`/`deploy`
# can resolve it like any other dependency. Once referenced-automation-utils
# is published to Nexus, delete this stage - the version already pinned in
# pom.xml will simply resolve from Nexus instead.
# ============================================================================

image: maven:3.9-eclipse-temurin-17

stages:
  - dependencies
  - build
  - test
  - report
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp"
  RERUN_FILE: "target/cucumber-reports/rerun.txt"
  UTILS_REPO_URL: "https://github.com/achaljoshi/referenced-automation-utils.git"

cache:
  key: "$CI_COMMIT_REF_SLUG-m2"
  paths:
    - .m2/repository

install-utils-dependency:
  stage: dependencies
  script:
    - git clone --depth 1 "$UTILS_REPO_URL" /tmp/referenced-automation-utils
    - cd /tmp/referenced-automation-utils && ./mvnw $MAVEN_CLI_OPTS -DskipTests install

build:
  stage: build
  needs: ["install-utils-dependency"]
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean compile test-compile
  artifacts:
    paths:
      - target/classes
      - target/test-classes
    expire_in: 1 hour

test:
  stage: test
  needs: ["build"]
  script:
    - rm -f "$RERUN_FILE"
    - ./mvnw $MAVEN_CLI_OPTS test -Denv=qa || true
    - |
      if [ -s "$RERUN_FILE" ]; then
        echo "== Retrying failed scenarios =="
        cat "$RERUN_FILE"
        ./mvnw $MAVEN_CLI_OPTS test -Denv=qa -Dcucumber.features="@$RERUN_FILE" || true
      fi
    - |
      if [ -s "$RERUN_FILE" ]; then
        echo "Scenarios still failing after retry:"
        cat "$RERUN_FILE"
        exit 1
      fi
      echo "All scenarios passed (first attempt or after retry)."
  artifacts:
    when: always
    paths:
      - target/cucumber-reports/
      - target/extent-report/
      - target/allure-results/
      - logs/
    reports:
      junit: target/cucumber-reports/cucumber.xml
    expire_in: 30 days

pages:
  stage: report
  image: node:20-slim
  needs: ["test"]
  script:
    - npm install -g allure-commandline --silent
    - allure generate target/allure-results --clean -o public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:
  stage: deploy
  needs: ["test"]
  script:
    - |
      cat > ci-settings.xml <<EOF
      <settings>
        <servers>
          <server><id>nexus-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
          <server><id>nexus-snapshots</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
        </servers>
      </settings>
      EOF
    - ./mvnw $MAVEN_CLI_OPTS -s ci-settings.xml -DskipTests deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
